[project]
name = "entropy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kartheekbvs", email = "bvskartheek83@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
     "mcp[cli]<2",
     "openai>=3.8.0",
     "python-dotenv>=1.2.3",
     "fastapi",
     "itsdangerous>=2.2.0",
     "httpx>=0.28.1",
     "supabase>=2.0.0",
     "cryptography>=50.0.2",
]

[project.scripts]
entropy = "entropy:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "entropy-engine",
]
